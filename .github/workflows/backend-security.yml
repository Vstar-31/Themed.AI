name: Backend snapshot security tests

on:
  pull_request:
    branches: [feature/windows-app-theming, feat/widget-package-workflow]
  push:
    branches: [feature/windows-app-theming, feat/widget-package-workflow]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-security-test.txt
      - run: python -m pip install -r requirements-security-test.txt
      - run: python -m pytest tests -q
        env:
          PYTHON_DOTENV_DISABLED: "1"
