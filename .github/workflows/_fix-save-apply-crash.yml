name: One-shot Save Apply crash fix

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Save & Apply transaction
        shell: pwsh
        run: |
          $path = 'ThemeManager.WinUI/Views/VibeFinderAIPage.xaml.cs'
          $text = Get-Content -Raw -Encoding UTF8 $path

          $text = $text.Replace('    private void SaveCredentials_Click(object sender, RoutedEventArgs e)', '    private async void SaveCredentials_Click(object sender, RoutedEventArgs e)')
          $text = $text.Replace('        _skinManager.UpdateVibeFinderCredentials(target);', '        await ApplyVibeFinderCredentialsAsync(target);')
          $text = $text.Replace('        _ = TryInjectLoginAsync(user, pass);', '        await TryInjectLoginAsync(user, pass);')

          $marker = @'
    /// <summary>Forces a fresh login in the embedded WebView2 with the given credentials,
'@
          $helper = @'
    /// <summary>
    /// Applies VibeFinder credentials without starting multiple concurrent skin rebuild/persist
    /// operations. The previous implementation delegated to a void method that launched one
    /// fire-and-forget SaveSkinAsync per VibeFinder skin; Save & Apply then immediately reset the
    /// hidden prewarm browser and pushed WebView commands while those native widget teardowns and
    /// recreations were still in flight. That overlap could terminate the WinUI process with
    /// 0xc000027b. Update all definitions first, then persist/rebuild one skin at a time.
    /// </summary>
    private async System.Threading.Tasks.Task ApplyVibeFinderCredentialsAsync(string target)
    {
        var vibeSkins = _skinManager.Skins
            .Where(s => s.Name.StartsWith("VibeFinder"))
            .ToList();

        bool changed = false;
        foreach (var skin in vibeSkins)
        {
            foreach (var measure in skin.Measures)
            {
                if (measure.Type != ThemeManager.Core.Skins.MeasureType.VibeTrackTitle &&
                    measure.Type != ThemeManager.Core.Skins.MeasureType.VibeTrackArtist &&
                    measure.Type != ThemeManager.Core.Skins.MeasureType.VibeMood &&
                    measure.Type != ThemeManager.Core.Skins.MeasureType.VibePlaybackState &&
                    measure.Type != ThemeManager.Core.Skins.MeasureType.VibeTrackProgress)
                {
                    continue;
                }

                if (!string.Equals(measure.Target, target, System.StringComparison.Ordinal))
                {
                    measure.Target = target;
                    changed = true;
                }
            }
        }

        if (!changed)
        {
            _logger.LogDebug("VibeFinderAIPage: Save & Apply — credentials unchanged; skipping skin rebuilds");
            return;
        }

        foreach (var skin in vibeSkins)
        {
            _logger.LogDebug("VibeFinderAIPage: persisting VibeFinder skin {SkinName} sequentially", skin.Name);
            await _skinManager.SaveSkinAsync(skin);
        }

        _logger.LogInformation("VibeFinderAIPage: VibeFinder credentials persisted for {SkinCount} skin(s) without concurrent rebuilds", vibeSkins.Count);
    }

'@

          if (-not $text.Contains($marker)) {
            throw 'Expected insertion marker was not found; refusing to modify the file.'
          }

          if (-not $text.Contains('await ApplyVibeFinderCredentialsAsync(target);')) {
            throw 'Expected Save & Apply replacement did not apply; refusing to continue.'
          }

          $text = $text.Replace($marker, $helper + $marker)
          Set-Content -Path $path -Value $text -Encoding UTF8

      - name: Build
        shell: pwsh
        run: dotnet build ThemeManager.sln --configuration Release --no-restore

      - name: Commit fix and remove one-shot workflow
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ThemeManager.WinUI/Views/VibeFinderAIPage.xaml.cs .github/workflows/_fix-save-apply-crash.yml
          git commit -m 'fix: serialize VibeFinder Save & Apply operations [skip ci]'
          git rm .github/workflows/_fix-save-apply-crash.yml
          git commit -m 'chore: remove one-shot crash fix workflow [skip ci]'
          git push origin master
