name: Windows Build

on:
  push:
    branches:
      - feature/windows-app-theming
  pull_request:
    branches:
      - feature/windows-app-theming
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ThemeManager.sln --runtime win-x64

      - name: Build solution
        run: dotnet build ThemeManager.sln --configuration Debug -p:Platform=x64 --no-restore

      - name: Run tests
        run: dotnet test ThemeManager.Tests/ThemeManager.Tests.csproj --configuration Debug -p:Platform=x64 --no-restore --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: TestResults
          if-no-files-found: ignore
